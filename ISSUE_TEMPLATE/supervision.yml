name: Supervision session
description: Prep and reflection for a slot with the supervisor
title: "Supervision — YYYY-MM-DD"
labels: ["meeting", "supervision"]
body:
  - type: input
    id: when
    attributes:
      label: When
    validations:
      required: true

  - type: textarea
    id: since
    attributes:
      label: Where we are since last time
      description: Two or three sentences. This is what you say out loud first.
    validations:
      required: true

  - type: textarea
    id: show
    attributes:
      label: What we're showing
      description: >
        A plot, a demo, a sketch, a number. Decide who presents it and
        how long it takes.
      value: |
        - **What:**
        - **Who presents:**
        - **Time needed:**
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: Questions for the supervisor
      description: >
        Ranked. The slot is short — if you only get through one, which
        one do you need most?
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision we want input on
      description: >
        Optional, but the highest-value use of the slot. State the options
        and where you're leaning, so he can push back on something concrete
        rather than being asked "what should we do".

  - type: textarea
    id: plan
    attributes:
      label: Plan for the slot
      value: |
        | Min | What |
        |-----|------|
        | 0–5 | Status |
        | 5–15 | Demo |
        | 15–25 | Questions |
        | 25–30 | Agree next steps |

  - type: markdown
    attributes:
      value: "---\n### Fill in *after* the session"

  - type: textarea
    id: said
    attributes:
      label: What he said
      description: Especially anything that contradicted what we expected.

  - type: textarea
    id: reflection
    attributes:
      label: Reflection — what changes because of this
      description: >
        If a direction changed, this text is the Context section of an ADR.
        Write it while you still remember the reasoning.

  - type: textarea
    id: actions
    attributes:
      label: Actions
      value: |
        - [ ] #
