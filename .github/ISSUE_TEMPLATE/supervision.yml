name: Supervision session
description: Prep and reflection for a slot with the supervisor
title: "Supervision — YYYY-MM-DD"
labels: ["meeting", "supervision"]
body:
  - type: textarea
    id: showing
    attributes:
      label: Where we are / what we're showing
      description: A few sentences plus whatever we demo — a plot, a number, a sketch.
      value: |
        -
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: What we want from him
      description: >
        Ranked. If we only get through one, which do we need most?
        Best ones state a choice and where we're leaning, so he can push
        back on something concrete.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: reflection
    attributes:
      label: Reflection — fill in after
      description: >
        What he said, especially anything that surprised us, and what
        changes because of it. Write it the same day.
      value: |
        -
